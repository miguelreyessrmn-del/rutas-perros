<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutas — PetGround</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <div class="brand-text">
        <h1>PetGround</h1>
        <p>Rutas de entrega</p>
      </div>
    </div>
    <div class="header-tabs">
      <button class="tab-btn active" id="tab-today" onclick="App.showScreen('today',this)">📋 Hoy</button>
      <button class="tab-btn" id="tab-dir" onclick="App.showScreen('directory',this)">🐶 Mascotas</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- ══ HOY (planeación — Fase 2. Ejecución paso a paso llega en Fase 3) ══ -->
  <div class="screen active" id="screen-today">

    <!-- ── Etapa 1: selección ── -->
    <div id="stage-seleccion">
      <div class="section-label">Punto de salida</div>
      <div class="origin-card">
        <div class="origin-dot" id="origin-dot"></div>
        <input type="text" id="origin-input" placeholder="Coordenadas de salida">
        <button id="btn-gps" title="Usar mi ubicación actual" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:8px;display:flex;align-items:center;transition:all 0.2s;flex-shrink:0;">
          <svg id="gps-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sky)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>
          </svg>
        </button>
      </div>
      <div id="gps-status" style="font-size:0.72rem;font-family:'Nunito',sans-serif;font-weight:600;color:var(--text-soft);margin-top:5px;min-height:16px;padding-left:2px;"></div>

      <div class="section-label">Modo de ruta</div>
      <div class="mode-selector">
        <button type="button" class="mode-btn active" data-mode="optimizada">⚡ Optimizada</button>
        <button type="button" class="mode-btn" data-mode="seleccion">🔢 Selección</button>
        <button type="button" class="mode-btn" data-mode="manual">✋ Manual</button>
      </div>
      <div class="hint-box" id="mode-hint"></div>

      <div class="section-label">¿Quiénes van hoy?</div>
      <div id="pets-select-grid" class="pets-select-grid"></div>
      <div class="selected-count" id="selected-count"></div>

      <div id="manual-order-section" style="display:none">
        <div class="section-label">Orden manual</div>
        <div id="manual-order-list" class="manual-order-list"></div>
      </div>

      <button class="btn-optimize" id="btn-calc-route">
        <span>⚡</span> Calcular ruta
      </button>
      <div id="status-msg"></div>
    </div>

    <!-- ── Etapa 2: revisión ── -->
    <div id="stage-revision" style="display:none">
      <div class="section-label">Mapa de la ruta</div>
      <div id="review-map" class="review-map"></div>

      <div id="review-summary" class="review-summary-wrap"></div>
      <div class="warning-box" id="review-warnings"></div>

      <div class="section-label">Paradas</div>
      <div id="review-list"></div>

      <div class="review-actions">
        <button class="btn-sm" id="btn-toggle-reorder">↕ Reordenar manualmente</button>
        <button class="btn-sm" id="btn-recalc-review">🔄 Recalcular</button>
      </div>

      <div id="review-reorder-section" style="display:none">
        <div class="section-label">Nuevo orden</div>
        <div id="review-manual-order-list" class="manual-order-list"></div>
        <button class="btn-save" id="btn-apply-review-reorder">Aplicar nuevo orden</button>
      </div>

      <div id="review-started-note"></div>

      <button class="btn-maps" id="btn-start-route" style="width:100%;margin:14px 0 8px">🚀 Iniciar ruta</button>
      <button class="btn-cancel" id="btn-back-to-selection">← Volver a selección</button>
    </div>

    <!-- ── Etapa 3: ejecución paso a paso ── -->
    <div id="stage-ejecucion" style="display:none"></div>
  </div>

  <!-- ══ DIRECTORIO ══ -->
  <div class="screen" id="screen-directory">

    <div class="section-label">Mascotas registradas</div>
    <div id="pet-grid" class="pet-grid"></div>

    <button class="btn-add-pet" id="btn-add-pet" onclick="UIPets.showAddForm()">
      ＋ Agregar mascota
    </button>

    <div class="add-pet-card" id="add-form" style="display:none">
      <div class="add-pet-title" id="form-title">Nueva mascota</div>

      <div class="form-row">
        <label class="form-label">Nombre de la mascota</label>
        <input class="form-input" id="f-name" type="text" placeholder="Ej: Canelo, Luka, Tisha…">
      </div>

      <div class="form-row">
        <label class="form-label">Propietario</label>
        <input class="form-input" id="f-owner" type="text" placeholder="Nombre del dueño">
      </div>

      <div class="form-row" style="display:flex;gap:10px">
        <div style="flex:1">
          <label class="form-label">Teléfono principal</label>
          <input class="form-input" id="f-phone1" type="tel" placeholder="222 123 4567">
        </div>
        <div style="flex:1">
          <label class="form-label">Teléfono secundario</label>
          <input class="form-input" id="f-phone2" type="tel" placeholder="Opcional">
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">Dirección completa</label>
        <input class="form-input" id="f-address" type="text" placeholder="Calle, número, colonia…">
      </div>

      <div class="form-row">
        <label class="form-label">Coordenadas</label>
        <div style="display:flex;gap:8px">
          <input class="form-input" id="f-latlon" type="text" placeholder="Pega aquí: 19.0654, -98.2558" style="flex:1">
          <button type="button" class="btn-sm" style="flex:0 0 auto;padding:0 14px" onclick="UIPets.applyQuickCoords()">Aplicar</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input class="form-input" id="f-lat" type="number" step="any" placeholder="Latitud">
          <input class="form-input" id="f-lon" type="number" step="any" placeholder="Longitud">
        </div>
        <div class="hint-box">
          💡 Abre Google Maps → mantén presionado el pin → copia el número tipo <code>19.0654, -98.2558</code> y pégalo arriba.
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">Google Place ID (opcional)</label>
        <input class="form-input" id="f-place-id" type="text" placeholder="Opcional">
      </div>

      <div class="form-row">
        <label class="form-label">Referencias para llegar</label>
        <textarea class="form-input" id="f-referencias" rows="2" placeholder="Portón negro, casa esquina…"></textarea>
      </div>

      <div class="form-row">
        <label class="form-label">Notas permanentes</label>
        <textarea class="form-input" id="f-notas" rows="2" placeholder="Alergias, comportamiento, indicaciones…"></textarea>
      </div>

      <div class="form-row" style="display:flex;gap:10px">
        <div style="flex:1">
          <label class="form-label">Disponible desde</label>
          <input class="form-input" id="f-available-from" type="time">
        </div>
        <div style="flex:1">
          <label class="form-label">Minutos de atención</label>
          <input class="form-input" id="f-minutos-atencion" type="number" min="1" value="5">
        </div>
      </div>

      <div class="form-row">
        <div class="toggle-row">
          <label class="toggle-label">
            <input type="checkbox" id="f-has-limit" onchange="UIPets.toggleFormLimit(this.checked)">
            <div class="toggle-track"></div>
            ⏰ Tiene horario límite de acceso
          </label>
          <div class="time-wrap" id="f-time-wrap">
            antes de <input type="time" id="f-limit-time" value="17:00">
          </div>
        </div>
        <div class="toggle-row">
          <label class="toggle-label">
            <input type="checkbox" id="f-activa" checked>
            <div class="toggle-track"></div>
            ✓ Mascota activa
          </label>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">Fotografías</label>
        <div id="form-photos"></div>
      </div>

      <button class="btn-save" onclick="UIPets.savePet()">Guardar mascota</button>
      <button class="btn-cancel" onclick="UIPets.hideAddForm()">Cancelar</button>
    </div>

  </div>
</div>

<!-- ══ MODAL: ficha de mascota ══ -->
<div class="profile-modal" id="profile-modal">
  <div class="profile-modal-inner">
    <div class="profile-modal-header">
      <button class="profile-close" onclick="UIPets.closeProfile()">✕</button>
      <span>Ficha de la mascota</span>
    </div>
    <div class="profile-body" id="profile-body"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/storageService.js"></script>
<script src="js/mapsService.js"></script>
<script src="js/routeService.js"></script>
<script src="js/petStore.js"></script>
<script src="js/routeStore.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.pets.js"></script>
<script src="js/ui.planning.js"></script>
<script src="js/ui.execution.js"></script>
<script src="js/app.js"></script>
</body>
</html>
